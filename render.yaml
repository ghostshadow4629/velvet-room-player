services:
  - type: web
    name: velvet-room-player
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/orange-black-music-player run build
    staticPublishPath: artifacts/orange-black-music-player/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html